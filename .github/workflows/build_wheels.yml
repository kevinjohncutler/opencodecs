name: Build Wheels

on:
  workflow_dispatch:
    inputs:
      publish:
        description: "Publish target"
        type: choice
        required: true
        default: "none"
        options: ["none", "testpypi", "pypi"]
  push:
    tags: ["v*"]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

# IMPORTANT: opencodecs links against ~12 system C libraries. cibuildwheel
# runs Linux builds inside a manylinux container that doesn't have most of
# those preinstalled — they get pulled in via the CIBW_BEFORE_ALL_LINUX
# script (see [tool.cibuildwheel.linux] in pyproject.toml), which dnf-installs
# what's available and builds libjxl from source via bench/build_libjxl.sh.
# macOS / Windows builds run on the host; we install via brew / conda
# before invoking cibuildwheel. ``auditwheel`` (Linux) and ``delocate``
# (macOS) bundle each linked .so/.dylib into the resulting wheel.
env:
  LIBJXL_VERSION: v0.11.2
  CACHE_VERSION: 1

jobs:
  build_wheels:
    name: ${{ matrix.cell.os }} ${{ matrix.cell.archs_linux }}${{ matrix.cell.archs_windows }}${{ matrix.cell.archs_macos }} · ${{ matrix.python }}
    runs-on: ${{ matrix.cell.os }}
    strategy:
      fail-fast: false
      # 4 archs × 4 Pythons = 16 parallel jobs. Each builds ONE wheel
      # via CIBW_BUILD=${{ matrix.python }}-*, so a 4-Python cibuildwheel
      # serial loop (~20 min wheel-build) becomes one ~5-min step running
      # 4-way parallel. Trade: 4× CI minutes (free on public repos),
      # 4× the BEFORE_ALL cost on cold-cache (mitigated by cache_warm.yml
      # populating refs/heads/main). Wall-clock drops Linux 32m → ~10m,
      # Windows 18m → ~9m, macOS 11m → ~5m.
      matrix:
        python: ["cp310", "cp311", "cp312", "cp313"]
        cell:
          - {os: ubuntu-latest, archs_linux: "x86_64"}
          - {os: ubuntu-24.04-arm, archs_linux: "aarch64"}
          - {os: windows-latest, archs_windows: "AMD64"}
          - {os: macos-latest, archs_macos: "arm64"}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # ---------- Caching ----------
      # 1. Linux: cache /usr/local for the cibuildwheel BEFORE_ALL libjxl
      #    build. ~5 min cold → ~30s warm. Key includes libjxl version +
      #    build script hash so a bump invalidates.
      - name: Cache codec-libs install (Linux)
        if: runner.os == 'Linux'
        uses: actions/cache@v4
        with:
          path: ${{ github.workspace }}/.cibw-cache/usr-local
          # Invalidate on any of: cache version bump, libjxl version bump,
          # build script edits. The single mount holds libjxl +
          # libjpeg-turbo + c-blosc2 + anything else build_codec_libs.sh
          # writes there.
          key: cibw-codec-libs-v${{ env.CACHE_VERSION }}-${{ runner.os }}-${{ matrix.cell.archs_linux }}-${{ env.LIBJXL_VERSION }}-${{ hashFiles('bench/build_libjxl.sh', 'bench/build_codec_libs.sh') }}

      # 2. cibuildwheel's own pip cache (per-OS so manylinux container
      #    doesn't share with macOS/Windows). Speeds up the metadata
      #    resolution pass on each build.
      - name: Cache cibuildwheel pip
        uses: actions/cache@v4
        with:
          path: |
            ~/.cache/pip
            ~/Library/Caches/pip
            ~\AppData\Local\pip\Cache
          key: cibw-pip-v${{ env.CACHE_VERSION }}-${{ runner.os }}-${{ hashFiles('pyproject.toml') }}
          restore-keys: cibw-pip-v${{ env.CACHE_VERSION }}-${{ runner.os }}-

      # 3. macOS: cache Homebrew downloads — the brew install before-all
      #    fetches ~700 MB cumulative, mostly already-installed packages
      #    that brew nonetheless touches. The download cache shaves ~30s.
      - name: Cache Homebrew downloads (macOS)
        if: runner.os == 'macOS'
        uses: actions/cache@v4
        with:
          path: ~/Library/Caches/Homebrew/downloads
          key: brew-cibw-v${{ env.CACHE_VERSION }}-${{ runner.os }}-${{ hashFiles('pyproject.toml') }}
          restore-keys: brew-cibw-v${{ env.CACHE_VERSION }}-${{ runner.os }}-

      # 4. Windows: cache the conda package tarballs.
      - name: Cache conda packages (Windows)
        if: runner.os == 'Windows'
        uses: actions/cache@v4
        with:
          path: |
            ~/conda_pkgs_dir
            ~\AppData\Local\Temp\conda_pkgs_dir
          key: cibw-conda-pkgs-v${{ env.CACHE_VERSION }}-${{ runner.os }}-${{ hashFiles('ci/environment.yml') }}
          restore-keys: cibw-conda-pkgs-v${{ env.CACHE_VERSION }}-${{ runner.os }}-

      # ---------- Per-OS pre-install (for macOS / Windows; Linux pre-installs
      # happen inside the manylinux container via CIBW_BEFORE_ALL) ----------

      - name: System libs (macOS)
        if: runner.os == 'macOS'
        run: |
          brew update --quiet
          brew install --quiet \
            jpeg-xl libavif libheif webp libpng jpeg-turbo openjpeg \
            zstd brotli c-blosc2 lz4 libdeflate \
            libaec liblerc zfp \
            rust cmake ninja
          # SZ3 + pcodec + SPERR + brunsli aren't packaged by brew;
          # source-build into the per-user opencodecs cache. setup.py
          # probes that prefix and delocate bundles the resulting dylibs
          # into the wheel. brunsli vendors brotli internally so no
          # brew-brotli link dependency.
          bash bench/build_codec_libs.sh --only=SZ3,pcodec,SPERR,brunsli,mozjpeg,libultrahdr

      - name: Miniconda + codec libs (Windows)
        if: runner.os == 'Windows'
        uses: conda-incubator/setup-miniconda@v3
        with:
          miniforge-version: latest
          activate-environment: ocbuild
          environment-file: ci/environment.yml
          channels: conda-forge
          use-mamba: true

      - name: Stash CONDA_PREFIX + add Library/bin to PATH (Windows)
        if: runner.os == 'Windows'
        shell: bash -el {0}
        run: |
          # The codec DLLs (libjxl, libavif, ...) live in
          # $CONDA_PREFIX/Library/bin. cibuildwheel inherits the runner
          # PATH, so prepending here is enough — no CIBW_ENVIRONMENT
          # gymnastics. CONDA_PREFIX itself goes through cibuildwheel
          # since setup.py reads it during the build.
          #
          # Convert C:\path\... to C:/path/... before stashing — cibuildwheel
          # parses CIBW_ENVIRONMENT with bash semantics and would
          # otherwise eat every backslash as an escape char.
          PREFIX_FWD=$(echo "${CONDA_PREFIX}" | tr '\\' '/')
          echo "OCBUILD_CONDA_PREFIX=${PREFIX_FWD}" >> "$GITHUB_ENV"
          echo "${CONDA_PREFIX}\\Library\\bin" >> "$GITHUB_PATH"

      - name: Enable MSVC dev environment (Windows)
        if: runner.os == 'Windows'
        uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: x64

      - name: Build SZ3 + pcodec + SPERR + brunsli from source (Windows)
        if: runner.os == 'Windows'
        shell: bash -el {0}
        run: |
          # None of these codecs are on conda-forge (or brunsli is
          # explicitly unstable there). SZ3 + SPERR + brunsli are
          # C++/CMake; pcodec is a Rust cdylib. brunsli vendors its
          # own brotli submodule. Everything installs into the per-user
          # opencodecs cache, and delvewheel picks up the DLLs from
          # $CONDA_PREFIX/Library/bin via repair-wheel-command.
          #
          # The Enable-MSVC step above sources vcvars64.bat and exports
          # the MSVC env (cl.exe on PATH, INCLUDE/LIB set) to this step
          # via GITHUB_ENV. Without it CMake's auto-detect picks
          # conda's gcc and produces gnu-format ``.dll.a`` import libs
          # that cibuildwheel's link.exe can't consume.
          #
          # brunsli's SHARED-target link on v0.1.3 retag #7 (run
          # 26350213014) failed with:
          #   link.exe ... -L${CONDA_PREFIX}/Library/lib
          #     -Wl,-rpath,${CONDA_PREFIX}/Library/lib /INCREMENTAL:NO ...
          #   ninja: build stopped: subcommand failed.
          # These -L/-Wl,-rpath flags are GCC/clang-style; MSVC link.exe
          # can't parse them. SZ3/SPERR built fine on the same run so it's
          # specific to brunsli's FetchContent(brotli)+SHARED-target path.
          #
          # Defense in depth:
          # 1. Prepend the runner's system cmake to PATH so it shadows
          #    conda-forge's patched cmake (which is the most likely
          #    flag-injection source — its conda recipe carries a patch
          #    to bake conda env paths into link commands).
          # 2. Unset LDFLAGS/CFLAGS/CXXFLAGS/CPPFLAGS so any conda
          #    activate hook that set them doesn't bleed in.
          # 3. Print env diagnostics so the next failure (if any) shows
          #    exactly which mechanism is still injecting the bad flags.
          #
          # Locally validated on the Windows host with the full ocbuild
          # conda env: brunsli builds clean under the system cmake path.
          export PATH="/c/Program Files/CMake/bin:$PATH"
          unset LDFLAGS CFLAGS CXXFLAGS CPPFLAGS
          export OPENCODECS_LIBS_PREFIX="${CONDA_PREFIX}/Library"
          echo "=== cmake in PATH ==="; which cmake; cmake --version | head -1
          echo "=== relevant env ==="; env | grep -iE 'LDFLAGS|CFLAGS|CXXFLAGS|CPPFLAGS|CMAKE_ARGS|CONDA_TOOLCHAIN|CONDA_BACKUP' || true
          bash bench/build_codec_libs.sh --only=SZ3,pcodec,SPERR,brunsli,mozjpeg,libultrahdr

      # ---------- cibuildwheel ----------
      - name: Build wheels
        uses: pypa/cibuildwheel@v3.3.1
        with:
          output-dir: ./wheelhouse
        env:
          CIBW_BUILD: '${{ matrix.python }}-*'
          CIBW_ARCHS_LINUX: ${{ matrix.cell.archs_linux }}
          CIBW_ARCHS_WINDOWS: ${{ matrix.cell.archs_windows }}
          CIBW_ARCHS_MACOS: ${{ matrix.cell.archs_macos }}
          # Linux cibuildwheel runs inside manylinux_2_28; mount the
          # cached prefix so libjxl built by BEFORE_ALL persists across
          # runs. OPENCODECS_LIBJXL_PREFIX (write side) and
          # OPENCODECS_JXL_PREFIX (read side via setup.py) both point at
          # the mounted cache. auditwheel bundles libjxl into the wheel
          # regardless of its install location.
          CIBW_CONTAINER_ENGINE: 'docker; create_args: -v ${{ github.workspace }}/.cibw-cache/usr-local:/cibw-jxl-prefix'
          # `>-` (strip-chomp) folds lines with single spaces and drops
          # the trailing newline. cibuildwheel parses the value with
          # shell semantics; a trailing \n breaks it silently on Linux
          # (env vars not set, every dep-less codec auto-skips) and
          # noisily on Windows (we hit "Malformed environment option"
          # in run #1).
          #
          # All three OPENCODECS_*_PREFIX vars point at the same cached
          # mount: build_libjxl.sh installs there (LIBJXL_PREFIX),
          # build_codec_libs.sh installs the source-built libs there
          # (LIBS_PREFIX), and setup.py probes there at build time
          # (JXL_PREFIX). Caching covers the whole tree — first run
          # builds libjxl + libjpeg-turbo + c-blosc2 (~7 min); warm
          # restores skip to ~30 s.
          # ENABLE_AOM=0 / ENABLE_X265=0 keep CI fast + side-step GPL
          # x265. Wheel ships decode-only AVIF (via dav1d) + decode-only
          # HEIF (via libde265). HEIF/AVIF encode-side tests skip
          # cleanly via the existing exception filter.
          #
          # LD_LIBRARY_PATH is critical for auditwheel — it's how
          # auditwheel resolves linked .so deps from the wheel's .pyd
          # files. Without /cibw-jxl-prefix/lib64 on it, auditwheel
          # bails with "Cannot repair wheel, libavif.so.16 not found".
          CIBW_ENVIRONMENT_LINUX: >-
            LIBJXL_VERSION=${{ env.LIBJXL_VERSION }}
            OPENCODECS_LIBJXL_PREFIX=/cibw-jxl-prefix
            OPENCODECS_LIBS_PREFIX=/cibw-jxl-prefix
            OPENCODECS_JXL_PREFIX=/cibw-jxl-prefix
            OPENCODECS_CODEC_LIBS_PREFIX=/cibw-jxl-prefix
            ENABLE_AOM=0
            ENABLE_X265=0
            LD_LIBRARY_PATH=/cibw-jxl-prefix/lib64:/cibw-jxl-prefix/lib:$LD_LIBRARY_PATH
          # PATH is set via $GITHUB_PATH in the prior step. Pipe both
          # CONDA_PREFIX (for runtime DLL search) and the explicit
          # OPENCODECS_CODEC_LIBS_PREFIX (which setup.py probes
          # unconditionally — pip's isolated build env scrubs CONDA_PREFIX
          # in some configs, so this is the belt-and-braces fallback).
          CIBW_ENVIRONMENT_WINDOWS: >-
            CONDA_PREFIX=${{ env.OCBUILD_CONDA_PREFIX }}
            OPENCODECS_CODEC_LIBS_PREFIX=${{ env.OCBUILD_CONDA_PREFIX }}

      # Verify every wheel contains every codec listed in
      # ci/check_wheel_contents.py::MUST_SHIP_ALL_PLATFORMS. setup.py's
      # required-header probe silently drops extensions whose library
      # prefix isn't on the search path — v0.1.2's Windows wheels
      # shipped without _sperr/_brunsli despite the CHANGES.rst claim,
      # because the codec libs weren't built on Windows. This check
      # fails the matrix job (and thus blocks the publish step) the
      # moment a codec silently goes missing.
      - name: Verify wheel codec coverage
        shell: bash
        run: |
          set -e
          # macOS runners ship `python3` but not `python` after
          # cibuildwheel tears down its per-build venv. Linux + Windows
          # bash images all expose `python3`. Use `python3` directly so
          # the step doesn't fail with "python: command not found" on
          # mac (v0.1.4 first retag tripped this).
          PY=$(command -v python3 || command -v python)
          for wheel in wheelhouse/*.whl; do
            "$PY" ci/check_wheel_contents.py "$wheel"
          done

      - uses: actions/upload-artifact@v4
        with:
          name: wheels-${{ matrix.cell.os }}-${{ matrix.cell.archs_linux }}${{ matrix.cell.archs_windows }}${{ matrix.cell.archs_macos }}-${{ matrix.python }}
          path: ./wheelhouse/*.whl
          if-no-files-found: error

  build_sdist:
    name: Build sdist
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip

      - name: Build sdist
        run: |
          python -m pip install --upgrade pip build
          python -m build --sdist

      - uses: actions/upload-artifact@v4
        with:
          name: sdist
          path: ./dist/*.tar.gz
          if-no-files-found: error

  publish_testpypi:
    name: Publish → TestPyPI
    needs: [build_wheels, build_sdist]
    runs-on: ubuntu-latest
    if: >
      github.event_name == 'workflow_dispatch' &&
      github.event.inputs.publish == 'testpypi'
    environment:
      name: testpypi
      url: https://test.pypi.org/p/opencodecs
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true
      - uses: pypa/gh-action-pypi-publish@release/v1
        with:
          repository-url: https://test.pypi.org/legacy/
          skip-existing: true

  publish_pypi:
    name: Publish → PyPI
    needs: [build_wheels, build_sdist]
    runs-on: ubuntu-latest
    if: >
      (github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')) ||
      (github.event_name == 'workflow_dispatch' && github.event.inputs.publish == 'pypi')
    environment:
      name: pypi
      url: https://pypi.org/p/opencodecs
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true
      - uses: pypa/gh-action-pypi-publish@release/v1
