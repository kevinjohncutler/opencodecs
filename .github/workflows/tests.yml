name: Tests

on:
  push:
    branches: [main]
  pull_request:
    branches: ["*"]
  workflow_dispatch:

# Cancel in-flight runs on the same ref.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

# Strategy: conda-forge on every platform.
#
#   1. Same versions everywhere. Apt's libjxl is 0.7.0 on Ubuntu LTS;
#      brew has 0.11.2; conda-forge has 0.11.2. With one channel, every
#      runner exercises identical code paths.
#   2. libjxl 0.11+ guaranteed. Stable distros all ship < 0.11; only
#      conda-forge and rolling distros have 0.11+. We cannot rely on
#      stable distros — and conda-forge works on every Linux base.
#   3. Already validated. The windows-vm setup uses exactly this conda env.

# Bump CACHE_VERSION to force a fresh conda env even when the
# environment.yml hash hasn't changed (e.g. to pick up a new conda-forge
# build of an existing version).
env:
  CACHE_VERSION: 1

jobs:
  test:
    name: ${{ matrix.os }} Py ${{ matrix.python-version }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        python-version: ["3.10", "3.13"]
    defaults:
      run:
        shell: bash -el {0}
    steps:
      - uses: actions/checkout@v4

      # ----- Cache conda packages -----
      # Caches the package tarballs conda downloaded after the first solve.
      # Subsequent runs skip the network round-trip — install is just an
      # extract from the cache. Keyed on environment.yml + Python version
      # + OS so a change to any of those triggers a fresh download.
      - name: Cache conda packages
        uses: actions/cache@v4
        with:
          path: |
            ~/conda_pkgs_dir
            ~/.conda/pkgs
          key: conda-pkgs-v${{ env.CACHE_VERSION }}-${{ runner.os }}-py${{ matrix.python-version }}-${{ hashFiles('ci/environment.yml') }}
          restore-keys: |
            conda-pkgs-v${{ env.CACHE_VERSION }}-${{ runner.os }}-py${{ matrix.python-version }}-
            conda-pkgs-v${{ env.CACHE_VERSION }}-${{ runner.os }}-

      - name: Set up Miniforge + codec libs
        uses: conda-incubator/setup-miniconda@v3
        with:
          miniforge-version: latest
          python-version: ${{ matrix.python-version }}
          activate-environment: ocbuild
          environment-file: ci/environment.yml
          channels: conda-forge
          # Use mamba where available (it's pre-staged in setup-miniconda v3)
          # for ~3x faster solves; falls back to conda when mamba's missing.
          use-mamba: true

      # ----- Pip cache (pip install -e .[test] downloads several wheels) -----
      - name: Cache pip wheels
        uses: actions/cache@v4
        with:
          path: |
            ~/.cache/pip
            ~/Library/Caches/pip
            ~\AppData\Local\pip\Cache
          key: pip-v${{ env.CACHE_VERSION }}-${{ runner.os }}-py${{ matrix.python-version }}-${{ hashFiles('pyproject.toml') }}
          restore-keys: pip-v${{ env.CACHE_VERSION }}-${{ runner.os }}-py${{ matrix.python-version }}-

      # ----- Build + test -----
      # OpenJPH and libultrahdr from source, with patches/<lib>/*.patch
      # applied, so the libraries the tests exercise are the ones the
      # wheels ship. Taking them from conda-forge instead would be
      # easier, but then a patch of ours would go out in wheels having
      # never been tested: the wheel workflow only runs a two-file smoke
      # test.
      #
      # libultrahdr was missing from this list while build_wheels.yml
      # built it, so every wheel shipped a libultrahdr built from five
      # of our patches that CI never exercised, and the four Ultra HDR
      # corpus tests skipped on every runner. It is on conda-forge for
      # all six of our platform/Python combinations, but that build
      # would not carry the patches, which is the whole reason this step
      # exists.
      #
      # Best-effort: if this fails on a platform, the extension is simply
      # not built and the affected tests skip, which is the behavior we
      # had before. The step still shows red in the log so it gets
      # noticed.
      - name: Build OpenJPH + libultrahdr from source (htj2k, uhdr backends)
        continue-on-error: true
        run: |
          export OPENCODECS_LIBS_PREFIX="$HOME/.opencodecs-libs"
          bash bench/build_codec_libs.sh --only=openjph,libultrahdr
          echo "OPENCODECS_CODEC_LIBS_PREFIX=$HOME/.opencodecs-libs" >> "$GITHUB_ENV"

      - name: Install package + test deps
        run: |
          python -m pip install --upgrade pip setuptools wheel
          python -m pip install -e .[test]

      # The reference implementations our parity tests compare against.
      # One at a time and best effort on purpose: a couple of these lack
      # wheels on some platform/Python combinations, and `pip install`
      # of the whole set would then install none of them. Losing one
      # comparison is acceptable; losing all of them silently is what
      # let six reader bugs through, so the next step says which are
      # missing rather than leaving the skips invisible.
      - name: Install reference implementations (best effort)
        continue-on-error: true
        run: |
          # Read the list out of pyproject with a regex rather than
          # tomllib, which is 3.11+ and this matrix still builds 3.10.
          python - <<'PY' > /tmp/reference_pkgs.txt
          import pathlib, re
          text = pathlib.Path("pyproject.toml").read_text()
          block = re.search(r"^reference = \[(.*?)^\]", text, re.S | re.M)
          print("\n".join(re.findall(r'"([^"]+)"', block.group(1))))
          PY
          while read -r pkg; do
            [ -z "$pkg" ] && continue
            python -m pip install "$pkg" || echo "::warning::no $pkg on this platform"
          done < /tmp/reference_pkgs.txt

      # Enforce only where the wheels are reliable. Elsewhere a missing
      # reference reader is a skipped comparison, not a failed build.
      - name: Require the core reference readers (one job)
        if: matrix.os == 'ubuntu-latest' && matrix.python-version == '3.13'
        run: echo "OPENCODECS_REQUIRE_REFERENCE=1" >> "$GITHUB_ENV"

      - name: Report which reference implementations are present
        run: |
          python - <<'PY'
          import importlib.util
          mods = ["pydicom", "nrrd", "nibabel", "mrcfile", "astropy", "rsciio",
                  "tensorstore", "ndtiff", "czifile", "nd2", "readlif",
                  "oiffile"]
          have = [m for m in mods if importlib.util.find_spec(m)]
          missing = [m for m in mods if m not in have]
          print("reference readers present:", have)
          print("reference readers MISSING:", missing or "none")
          PY

      - name: List registered codecs (libjxl MUST be present)
        run: |
          python -c "
          import opencodecs as oc
          names = sorted(c['name'] for c in oc.list_codecs())
          print(f'{len(names)} codecs:', names)
          assert 'jxl' in names, 'libjxl extension MUST register on every platform'
          "
          python - <<'PY'
          from opencodecs._htj2k_codec import _HAVE_BACKEND as htj2k
          from opencodecs.uhdr import _HAVE_BACKEND as uhdr
          print("htj2k backend built:", htj2k)
          print("uhdr  backend built:", uhdr)
          PY

      # Small native-format fixtures (~8 MB) so the corpus decode tests
      # actually run rather than skipping. Best-effort on purpose: these
      # come from third-party hosts, and an upstream being briefly down
      # is not a reason to fail a build. The tests skip when the files
      # are absent, so the worst case is the coverage we had before.
      - name: Fetch native-format corpus fixtures (best effort)
        continue-on-error: true
        run: |
          python corpus/corpus.py fetch bmpsuite bcdec_test_images \
            htj2k_wg1_conformance ultrahdr_pixel6
          python corpus/corpus.py coverage

      - name: Run tests
        run: pytest -q --cov=src/opencodecs --cov-report=xml --junitxml=junit.xml

      - name: Upload coverage + junit (one matrix cell)
        if: matrix.os == 'macos-latest' && matrix.python-version == '3.13'
        uses: actions/upload-artifact@v4
        with:
          name: test-results
          path: |
            coverage.xml
            junit.xml
          if-no-files-found: warn
