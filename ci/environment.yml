name: ocbuild
channels:
  - conda-forge
  - nodefaults
# Codec C libraries opencodecs links against. Python comes from
# setup-miniconda's python-version input (so the matrix can cycle
# 3.10 / 3.13 against the same lib set). Bumping any version here
# invalidates the actions/cache key automatically.
dependencies:
  - libjxl
  - libavif
  - libheif
  - libwebp
  - libpng
  - libjpeg-turbo
  - openjpeg
  - zlib
  - libdeflate
  - brotli
  - libbrotlicommon
  - c-blosc2
  - lz4-c
  - zstd
  # Tier 1 scientific compressors. SZ3 + pcodec aren't on conda-forge;
  # they're built from source by an explicit step in build_wheels.yml
  # (cmake + cargo — Rust toolchain provided by the `rust` package below).
  - libaec
  - lerc
  - zfp
  # lcms2 needed at TEST time on Windows. opencodecs._cms_codec does a
  # ctypes.CDLL("lcms2.dll") at first use; without the conda package the
  # DLL isn't on PATH and 8 test_phase7_cms.py tests fail with ImportError.
  # Linux + macOS pick lcms2 up from system / brew so the entry is no-op
  # there but harmless.
  - lcms2
  - rust
  - cmake
  - ninja
