# opencodecs reference corpus.
#
# Fetch-from-origin: nothing here is redistributed. Each entry records
# where a file lives upstream, what it is licensed under, and which
# codecs it exercises, so "which codec has no real data behind it" is a
# query rather than a guess.
#
# license = "unverified" means the terms were not confirmed from the
# source page. That is a TODO, not a claim, and it only becomes load-
# bearing if we ever mirror instead of linking.

schema = 1

[[dataset]]
id = "eer_empiar10568"
name = "EER: Falcon 4 micrograph from EMPIAR-10568 (~220 MB)"
license = "CC0-1.0"
codecs = ["eer"]
homepage = "https://empiar.pdbj.org/en/entry/10568/"
notes = "Genuine Thermo Fisher Falcon 4 output: 4096x4096, 721 frames, compression 65001 (7-bit RLE, 2+2 sub-pixel bits), CC0. https://empiar.pdbj.org/en/entry/10568/ Synthetic bitstreams cannot stand in for\nthis. A real frame terminates by walking its position exactly onto the last cell and then carries a trailing footer, and that is the behavior the decoder's termination rule is built around. Opt-in\nbecause of the size: pass --eer."
  [[dataset.file]]
  url = "https://ftp.ebi.ac.uk/empiar/world_availability/10568/data/Images-Disc1/GridSquare_8824187/Data/FoilHole_8851341_Data_8849615_8849617_20200709_154330.eer"
  path = ".test_data/eer/empiar10568_falcon4.eer"

