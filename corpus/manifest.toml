[[dataset]]
id = "sdrbench_exafel"
name = "SDRBench EXAFEL: LCLS X-ray detector frames (~79 MB)"
license = "unverified"
codecs = ["zstd", "lz4", "brotli", "snappy", "bitshuffle", "blosc2", "b2nd", "isal", "aec"]
homepage = "https://sdrbench.github.io/"
notes = "Raw uint16 frames from an LCLS free-electron laser detector, 10x32x185x388. Byte-oriented compressors have to be measured on data like this: on random bytes zstd and brotli both report 1.00x, and on these frames they report 1.60x and 1.58x. Also the counterexample that bitshuffle is not free: bitshuffle then zstd gives 1.37x here, worse than zstd alone, inverting the usual microscopy idiom."

  [[dataset.file]]
  url = "https://g-d0cd3f.fd635.8443.data.globus.org/raw-data/EXAFEL/SDRBENCH-EXAFEL-10x32x185x388.tar.gz"
  path = ".test_data/sdrbench/SDRBENCH-EXAFEL-10x32x185x388.tar.gz"

