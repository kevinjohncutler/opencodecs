[[dataset]]
id = "emdb_map_3001"
name = "MRC: an EMDB cryo-EM density map (EMD-3001)"
license = "EMDB terms: freely available without restriction"
codecs = ["mrc"]
homepage = "https://www.ebi.ac.uk/emdb/EMD-3001"
notes = "A deposited cryo-EM reconstruction, written by the software an actual structural-biology pipeline used rather than by us. Real MRC files carry things a synthetic header does not: a non-zero extended header, an axis order that is not always 1/2/3, and origin and cell values that make voxel size meaningful. EMDB publishes maps gzipped, so this is the entry that motivated gunzip support in the fetcher."
