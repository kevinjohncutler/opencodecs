[[dataset]]
id = "nrrd_pynrrd_variants"
name = "NRRD: one volume in raw, gzip and bzip2, plus a detached header pair"
license = "unverified"
codecs = ["nrrd"]
homepage = "https://github.com/mhe/pynrrd"
notes = "The same 30x30x30 ball encoded four ways, from the reference Python implementation's test data. Same design as the DICOM entry: one volume, several encodings, so a decode difference is the parser rather than the picture. The .nhdr plus .raw pair is the detached case, where the header names a separate data file and a reader that only knows about attached data silently has nothing to read."
