followups = ["eer", "czi", "jpeg2k", "jxl", "avif", "blosc2", "b2nd", "sperr", "zstd", "adapter:omezarr"]
investigate = []
depends_on = ["bounded_pipeline"]
current = "WorkerBudget coordinates nested work and explicitly shared concurrent calls. Native inner workers are clamped, with Zstandard using zero background workers. EER accumulators propagate worker errors and share explicit budgets. Fast serial and persistent-pool paths remain."
action = "Define one caller-visible worker budget with explicit ownership and an outer-versus-inner policy. Reuse existing pools only where concurrent and repeated-call measurements support it."
