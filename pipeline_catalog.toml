limits = "x86-64 Linux, against this round's starting tree: full 400-tile level 30.7 to 17.5 ms, 2000 px crop 9.9 to 4.7 ms with traced peak 18.9 to 8.3 MB, 200 small crops 68.6 to 54.2 ms, first crop 1.22 to 0.22 ms (the pre-index original was 0.31), overlapping mosaic full level 33.4 to 23.9 ms. Serial decode into a large cold output is bound by memory, not by decode: about 78 us per 128 KB tile against 50 us into a hot buffer; huge pages made it 2.2x slower. The batched iter_regions planner uses the same path through its _decode_region_windows hook, decoding each tile shared by several boxes once into every box (disjoint crops 6.3 to 5.0 ms against owned tiles on Linux); it passes each tile only the outputs it touches, because the native call converts every output it is given."
