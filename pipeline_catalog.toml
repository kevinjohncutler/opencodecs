# Cross-codec optimization audit and implementation worklist.
# Runtime capability facts remain in capabilities.toml. This file does not
# advertise planned work as shipped or infer native support from a format name.
# Each registered codec belongs to one family; direct adapters are explicit.
# pilots/followups identify consumers; investigate lists source-audited targets.
# Complete closes the stated implementation or assessment, not every possible
# new native feature. Each current/limits field records the shipped boundary.
# Evidence is repository-relative path:Symbol (or an entire source file).
# Validate/report: python ci/check_pipeline_catalog.py verify|report
schema = 1
reviewed = "2026-09-24"


[[family]]
id = "indexed_containers"
members = ["tiff", "czi", "hdf5", "emd", "fits", "dicom", "eer", "nd2", "oir", "vsi", "oib"]
scope = "Independent tiles, chunks, frames, or records can share selection, bounded fetching, decoding, and placement. Each reader retains responsibility for indexes, filters, and compositing."
evidence = ["src/opencodecs/core/parallel.py:run_batched", "src/opencodecs/_tiff_pyramid.py:TiffPyramidReader._fill_segments"]

[[family]]
id = "raw_arrays"
members = ["mrc", "nifti", "nrrd", "numpy", "dm", "lif"]
scope = "Prioritize offset selection, coalescing, buffer ownership, and direct destinations. Raw copies usually stay serial. Compressed whole-stream variants need different access policies."
evidence = ["src/opencodecs/_mrc_codec.py:MrcCodec", "src/opencodecs/_numpy_codec.py:NumpyCodec", "src/opencodecs/_nifti_codec.py:NiftiCodec"]

[[family]]
id = "byte_compressors"
members = ["deflate", "gzip", "zstd", "lz4", "brotli", "bz2", "lzma", "snappy", "snappy_framed", "blosc2", "aec", "none"]
scope = "Container blocks already supply independent units. Whole compressed streams require state across feeds; arbitrary byte cuts do not create independently decodable blocks."
evidence = ["src/opencodecs/core/segment_compression.py:encode_segment", "src/opencodecs/codecs/_lz4.pyx:decode", "src/opencodecs/codecs/_brotli.pyx:decode"]

[[family]]
id = "scientific_arrays"
members = ["b2nd", "lerc", "pcodec", "sz3", "sperr", "zfp"]
scope = "Prioritize destination forwarding and thread budgets. Fixed-rate ZFP has a concrete bounded-placement path; other partial or progressive access needs format-specific evidence."
evidence = ["src/opencodecs/_zfp_codec.py:_decode_parallel", "src/opencodecs/_b2nd_codec.py:B2ndCodec"]

[[family]]
id = "still_and_progressive"
members = ["png", "jpeg", "mozjpeg", "jpeg2k", "htj2k", "jpegls", "rgbe", "bmp", "qoi", "brunsli"]
scope = "Share destination contracts and independently encoded container work now. Rows, native callbacks, and progressive passes require explicit format adapters, not generic slicing."
evidence = ["src/opencodecs/codecs/_png.pyx:decode", "src/opencodecs/codecs/_jpeg2k.pyx:decode_region", "src/opencodecs/codecs/_brunsli.pyx:_sink_write"]

[[family]]
id = "sequences_and_collections"
members = ["gif", "jxl", "webp", "avif", "heif"]
scope = "Sequence reading does not imply sequence encoding or independent frames. GIF and JPEG XL accept writer frames and drain encoded output to destinations."
evidence = ["src/opencodecs/_gif_codec.py:_LazyGifWriter", "src/opencodecs/_jxl_codec.py:_JxlStreamWriter", "src/opencodecs/_webp_codec.py:WebpCodec"]

[[family]]
id = "filters_and_blocks"
members = ["bitshuffle", "byteshuffle", "delta", "floatpred", "xor", "packints", "quantize", "dicomrle", "rcomp", "bcn", "cms"]
scope = "Use correctly delimited rows/blocks and bounded scratch. Preserve predictor distance, channel layout, byte order, packed tails, and transform ownership; no independent stream seek point is implied."
evidence = ["src/opencodecs/_predictor_codec.py:FloatpredCodec", "src/opencodecs/_cms_codec.py:cms_transform", "src/opencodecs/_bcn_codec.py:BcnCodec"]

