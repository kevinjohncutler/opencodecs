investigate = []
depends_on = ["czi_fused_zstd_decode", "czi_slide_geometry", "czi_region_index"]
current = "Zstd tiles decode through _zstd.decode_unshuffle_windows, which writes each tile's windows into the region output in one native call. Serial requests go in directory order. Parallel requests write only each tile's visible pieces (what no later same-plane tile covers), which are disjoint, so workers write in any order with unchanged last-wins results, and hidden tiles are skipped. The level index answers its first query with one vectorized scan and builds its grid on the second."
