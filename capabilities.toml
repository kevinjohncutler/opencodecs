# Streaming and web-delivery capabilities, per codec.
#
# What this file is for: opencodecs promises more than "it
# decodes" -- it promises formats that can be streamed, served
# over HTTP with range requests, decoded a tile at a time, and
# viewed at multiple resolutions. Those promises are per format,
# and some of them are impossible for some formats. Without a
# record, "we have not done that yet" and "that cannot be done"
# look identical from outside.
#
# Every field below is seeded from evidence rather than opinion:
# the Codec class flags, whether the reader reaches storage
# through the read_at contract, and whether a PyramidReader
# backend exists. ci/check_capabilities.py re-derives them and
# fails if this file has drifted, which is what stops it turning
# into the kind of stale claim a docstring becomes.
#
# feasible = "no" needs a reason. That is the field that carries
# the actual engineering judgement.

schema = 1

[[codec]]
name = "aec"
multi_frame = false
chunked = false
streaming_decode = false
parallel_decode = false
range_reads = false
pyramid = false
http = false
feasible = "unassessed"

