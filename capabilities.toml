# Streaming and web-delivery capabilities, per codec.
#
# What this file is for: opencodecs promises more than "it decodes" --
# it promises formats that can be streamed, served over HTTP with range
# requests, decoded a tile at a time, and viewed at multiple
# resolutions. Those promises are per format, and some of them are
# impossible for some formats. Without a record, "we have not done that
# yet" and "that cannot be done" look identical from outside.
#
# The seven booleans are derived from the tree, not asserted here:
# ci/check_capabilities.py re-reads the Codec class flags and greps for
# the offset-read and PyramidReader call sites, and `verify` fails when
# this file disagrees with what it finds. Two of them mean something
# narrower than their name suggests:
#
#   range_reads  the reader reaches storage by offset (read_at,
#                read_many) rather than swallowing the file.
#   http         it fetches only the bytes it needs. A format that can
#                be opened from a URL with one whole-file GET does not
#                count -- see jxl, whose own docstring says so.
#
# `feasible` is the field no script can derive, because it is a
# judgment about the format rather than a fact about the tree:
#
#   done   everything this format can support, we support.
#   gap    something the format supports is not built. `gaps` names
#          which capabilities, and `note` says what it would take.
#   no     nothing further is available here. `note` says why -- either
#          the format cannot express it (a prefix sum has no seek
#          point, a single deflate frame has no index) or the upstream
#          library exposes no entry point for it.
#
# Every entry carries a `note`, including the ones with no work left,
# because the reason is the part that goes stale. A gap may only name a
# capability currently recorded as false; claiming a gap for something
# already built is a contradiction the apply-time check rejects.
#
# Where a note cites a number, it was measured, not assumed. The three
# `parallel_decode = true` image codecs were timed at one thread versus
# eight before the flag was set, and heif -- which calls the threading
# API but measured 1.00x -- is deliberately left false.

schema = 1

[[codec]]
name = "aec"
multi_frame = false
chunked = false
streaming_decode = false
parallel_decode = false
range_reads = false
pyramid = false
http = false
feasible = "no"
note = "libaec is handed one HDF5/szip chunk at a time, so the container has already chosen the unit of streaming and the codec never sees a whole file. CCSDS 121 carries no block index to seek into either."

[[codec]]
name = "avif"
multi_frame = false
chunked = false
streaming_decode = false
parallel_decode = true
range_reads = false
pyramid = false
http = false
feasible = "gap"
gaps = ["multi_frame", "chunked"]
note = "libavif reads image sequences and progressive layers through avifDecoderNextImage and imageCount, neither of which we call, and AVIF grid images are tiles with their own item offsets. Decode already threads: measured 7.6x going from one core to eight."

[[codec]]
name = "b2nd"
multi_frame = false
chunked = true
streaming_decode = false
parallel_decode = true
range_reads = false
pyramid = false
http = false
feasible = "done"
note = "both are built. decode_slice() pulls an n-dimensional sub-box, decompressing only the chunks it intersects: measured 8x cheaper for a 0.2% box of a 256x256x64 array. Threads are applied to the array's own context rather than the global setting."

[[codec]]
name = "bcn"
multi_frame = false
chunked = false
streaming_decode = false
parallel_decode = false
range_reads = false
pyramid = false
http = false
feasible = "gap"
gaps = ["chunked", "parallel_decode"]
note = "every 4x4 block is independently decodable at a fixed byte offset, which is the whole point of block compression: a sub-rectangle is a block range and the blocks have no dependencies at all. We decode the entire surface in one pass."

[[codec]]
name = "bitshuffle"
multi_frame = false
chunked = false
streaming_decode = false
parallel_decode = false
range_reads = false
pyramid = false
http = false
feasible = "no"
note = "a bit permutation inside a block the container already sized. Streaming and chunking are decisions made by whatever holds the block."

[[codec]]
name = "blosc2"
multi_frame = false
chunked = true
streaming_decode = false
parallel_decode = true
range_reads = false
pyramid = false
http = false
feasible = "done"
note = "both are built. decode_partial() reads a range of items straight out of a compressed buffer, touching only the blocks it covers: 1/64th of a 64 MB chunk costs 64x less than expanding the whole thing. Threading goes through a decompression context, never the process-global blosc2_set_nthreads, and gives 5.9x on 64 MB -- but 0.42x on 1 MB, so it stays opt-in rather than automatic. Item width is read from the chunk header, not taken from the caller."

[[codec]]
name = "bmp"
multi_frame = false
chunked = false
streaming_decode = false
parallel_decode = false
range_reads = false
pyramid = false
http = false
feasible = "gap"
gaps = ["streaming_decode"]
note = "an uncompressed BMP is a header plus fixed-stride rows, so rows can be produced as bytes arrive and row N is computable arithmetic. The RLE4 and RLE8 variants are sequential and would not get this."

[[codec]]
name = "brotli"
multi_frame = false
chunked = false
streaming_decode = false
parallel_decode = false
range_reads = false
pyramid = false
http = false
feasible = "gap"
gaps = ["streaming_decode"]
note = "BrotliDecoderDecompressStream decodes incrementally. A brotli stream carries no block index, so seeking into one is unavailable at any amount of effort."

[[codec]]
name = "brunsli"
multi_frame = false
chunked = false
streaming_decode = false
parallel_decode = false
range_reads = false
pyramid = false
http = false
feasible = "no"
note = "a whole-file JPEG recompression: the decoder rebuilds the original JPEG in a single pass and upstream exposes no incremental entry point."

[[codec]]
name = "byteshuffle"
multi_frame = false
chunked = false
streaming_decode = false
parallel_decode = false
range_reads = false
pyramid = false
http = false
feasible = "no"
note = "a byte permutation inside a block the container already sized; the filter never sees a whole file."

[[codec]]
name = "bz2"
multi_frame = false
chunked = false
streaming_decode = false
parallel_decode = false
range_reads = false
pyramid = false
http = false
feasible = "gap"
gaps = ["streaming_decode"]
note = "BZ2_bzDecompress is incremental. bzip2's 900k blocks are independently decodable in principle, which is how bzip2recover works, but finding their boundaries means scanning the whole stream, so random access is not worth claiming."

[[codec]]
name = "cms"
multi_frame = false
chunked = false
streaming_decode = false
parallel_decode = false
range_reads = false
pyramid = false
http = false
feasible = "no"
note = "a color transform over pixels already in memory. There is no bitstream, so none of these dimensions are its to have."

[[codec]]
name = "czi"
multi_frame = true
chunked = true
streaming_decode = true
parallel_decode = true
range_reads = true
pyramid = true
http = true
feasible = "done"
note = "streaming, subblock random access, range reads, HTTP, multi-scene stacks and the pyramid CZI natively stores are all wired, and subblocks decode in parallel. Nothing the format offers is unbuilt."

[[codec]]
name = "deflate"
multi_frame = false
chunked = false
streaming_decode = false
parallel_decode = false
range_reads = false
pyramid = false
http = false
feasible = "gap"
gaps = ["streaming_decode"]
note = "libdeflate is one-shot by design and ships no streaming API, so this means adding a zlib inflate path beside it rather than setting a flag. A raw deflate stream has no index, so seeking is out regardless."

[[codec]]
name = "delta"
multi_frame = false
chunked = false
streaming_decode = false
parallel_decode = false
range_reads = false
pyramid = false
http = false
feasible = "no"
note = "a prefix sum: element N depends on every element before it, so there is no boundary inside one buffer to seek to. The container picks the block, and the decode is already a nogil pass over it."

[[codec]]
name = "dicom"
multi_frame = true
chunked = true
streaming_decode = true
parallel_decode = false
range_reads = true
pyramid = false
http = true
feasible = "gap"
gaps = ["parallel_decode", "pyramid"]
note = "chunked was recorded as missing and was there: the Basic Offset Table gives per-frame offsets, the reader uses them, and the codec simply never set the flag, inheriting False from the base class. Measured on a 60-frame 31.5 MB file, r[59] takes 0.07 ms against 4.34 ms for read(), and over HTTP it moves 1.9% of the file. Frames decode independently, so threading them needs no format work. VL Whole Slide Microscopy DICOM is genuinely pyramidal, which is real but is a reader of its own rather than a missing switch."

[[codec]]
name = "dicomrle"
multi_frame = false
chunked = false
streaming_decode = false
parallel_decode = false
range_reads = false
pyramid = false
http = false
feasible = "no"
note = "the 64-byte header does give per-segment offsets, but the segments are byte planes of one image (high byte, then low byte), not independent regions: every pixel needs all of them. The offset table therefore buys no random access."

[[codec]]
name = "dm"
multi_frame = true
chunked = false
streaming_decode = false
parallel_decode = false
range_reads = false
pyramid = false
http = false
feasible = "gap"
gaps = ["streaming_decode", "range_reads", "http", "chunked"]
note = "DM3 and DM4 tags carry absolute offsets to uncompressed image data, so a plane is an offset and a length. Nothing in the format requires reading the whole file; the reader simply does."

[[codec]]
name = "eer"
multi_frame = true
chunked = false
streaming_decode = true
parallel_decode = false
range_reads = true
pyramid = false
http = true
feasible = "gap"
gaps = ["chunked", "parallel_decode"]
note = "EER frames are independent electron-event bitstreams, so both gaps are buildable and neither is built. chunked was recorded as done and was not: indexing worked, but through the base Reader's default __getitem__, which walks iter_frames() to get there -- measured 6.71 ms for frame 0 and 1218 ms for frame 720 of 721. A flag that says \"indexing is offered\" is not the same as one that says \"indexing is cheap\", and this codec had the second set from the first. Frames decode independently, so threading them needs no format work either. There are no resolution levels, so there is no pyramid."

[[codec]]
name = "emd"
multi_frame = true
chunked = true
streaming_decode = true
parallel_decode = false
range_reads = true
pyramid = false
http = true
feasible = "done"
note = "all four arrived at once, and by wiring rather than by new parsing: EMD is HDF5, and every HDF5-backed reader here now reaches h5py through the shared h5_source, which turns an http(s) URL into a range-reading file-like. Reading one dataset out of a 16.8 MB remote file moved 0.09 MB in 10 requests, byte-identical to the local read. chunked and streaming_decode were never missing so much as unrecorded: the reader has advertised is_chunked all along, and pulling the small dataset from a 134 MB file takes 0.35 ms against 15.9 ms for the big one, so a frame costs its own size."

[[codec]]
name = "fits"
multi_frame = true
chunked = true
streaming_decode = true
parallel_decode = false
range_reads = true
pyramid = false
http = true
feasible = "gap"
gaps = ["parallel_decode"]
note = "chunked was recorded as missing and was there, for the same reason as dicom: the flag was never set and inherited False. An HDU is a seek -- headers are walked, only the requested HDU's data is read -- and on a 24-HDU 12.7 MB file the last one moves 5.2% of the file over HTTP. Tiles within a compressed HDU still decode independently, so threading them is the remaining work. FITS has no resolution levels, so there is no pyramid."

[[codec]]
name = "floatpred"
multi_frame = false
chunked = false
streaming_decode = false
parallel_decode = false
range_reads = false
pyramid = false
http = false
feasible = "no"
note = "TIFF's floating-point predictor: a byte shuffle plus a delta across one scanline. The scanline is the unit, and tiff chose it."

[[codec]]
name = "gif"
multi_frame = true
chunked = false
streaming_decode = true
parallel_decode = false
range_reads = false
pyramid = false
http = false
feasible = "gap"
gaps = ["range_reads", "http"]
note = "frames are sequential LZW carrying disposal state, so frame N really does require the frames before it and chunked is unavailable at any effort. Fetching the file itself by ranges still is."

[[codec]]
name = "gzip"
multi_frame = false
chunked = false
streaming_decode = false
parallel_decode = false
range_reads = false
pyramid = false
http = false
feasible = "gap"
gaps = ["streaming_decode"]
note = "gzip is the streaming case by construction, which is what gzip(1) does; the binding is one-shot. Random access needs an index built by a full pass, so it is not part of the format."

[[codec]]
name = "hdf5"
multi_frame = true
chunked = true
streaming_decode = true
parallel_decode = false
range_reads = true
pyramid = false
http = true
feasible = "gap"
gaps = ["parallel_decode"]
note = "chunks are independent and the B-tree already gives their offsets, so multi-core chunk decode needs no format work. HDF5 itself has no pyramid; that is a convention layered on top, and belongs to the layer that defines it."

[[codec]]
name = "heif"
multi_frame = false
chunked = false
streaming_decode = false
parallel_decode = false
range_reads = false
pyramid = false
http = false
feasible = "gap"
gaps = ["multi_frame", "chunked"]
note = "HEIF grid images are tiles with their own item offsets, and HEIF holds image sequences; we decode only the primary image. Threading is already requested via heif_context_set_max_decoding_threads, but an untiled image measures 1.00x from one core to eight, so parallel_decode is false on purpose."

[[codec]]
name = "htj2k"
multi_frame = false
chunked = false
streaming_decode = false
parallel_decode = false
range_reads = false
pyramid = true
http = false
feasible = "done"
note = "reduced-resolution decode is built through OpenJPH's restrict_input_resolution, applied between read_headers and create so the fine subbands are never read: a 256x256 overview of a 2048x2048 codestream takes 1.4 ms against 97 ms full, about 70x. Htj2kPyramidReader exposes the levels, and the codestream's own num_decompositions bounds them. Nothing further is available to call: openjph 0.27's public headers expose neither a threading API nor a per-tile decode."

[[codec]]
name = "jpeg"
multi_frame = false
chunked = false
streaming_decode = false
parallel_decode = false
range_reads = false
pyramid = true
http = false
feasible = "gap"
gaps = ["streaming_decode"]
note = "DCT-scaled decode is built: scale=1/2, 1/4 and 1/8 come straight out of a smaller inverse DCT, and JpegPyramidReader exposes them as levels. Be clear about what that buys, though -- the Huffman pass still reads every coefficient, so a 1/8 decode measured 1.3x faster than full on noisy content and 2.0x on photo-like; the win is a 192 KB output instead of 12 MB, not fast JPEG. jpeg_read_scanlines would still add row-at-a-time streaming. Restart markers could drive parallel strips, but libjpeg-turbo exposes no entry point."

[[codec]]
name = "jpeg2k"
multi_frame = false
chunked = true
streaming_decode = false
parallel_decode = true
range_reads = false
pyramid = true
http = false
feasible = "done"
note = "everything JPEG 2000 offers here is built. Reduced-resolution decode skips the finest subbands before they are entropy-decoded -- a 256x256 overview of a 2048x2048 codestream takes 2.3 ms against 211 ms for a full decode. decode_region takes a window through opj_set_decode_area (a 128x128 window of a 1024x1024 image is 13x cheaper than the whole), and decode_tile takes one tile of a tiled codestream, also 13x. The two compose: region coordinates stay on the full-resolution grid at every reduce level, so a caller picks a window once and changes only the zoom. Threading was already wired at 6.6x. Note neither this encoder nor imagecodecs writes TILED codestreams, so the tile path is tested against one made by openjpeg's own CLI and skipped where that is absent."

[[codec]]
name = "jpegls"
multi_frame = false
chunked = false
streaming_decode = false
parallel_decode = false
range_reads = false
pyramid = false
http = false
feasible = "no"
note = "CharLS exposes only charls_jpegls_decoder_decode_to_buffer, a whole-image call: there is no scanline or region entry point to build streaming on, and JPEG-LS has no tiles."

[[codec]]
name = "jxl"
multi_frame = true
chunked = true
streaming_decode = true
parallel_decode = true
range_reads = false
pyramid = false
http = false
feasible = "gap"
gaps = ["pyramid"]
note = "JXL's progressive DC is an 8x downsampled image sitting inside the bitstream, reachable through JxlDecoderSetProgressiveDetail(kDC) with JXL_DEC_FRAME_PROGRESSION -- a preview from the first few kilobytes. http is false deliberately: jxl.open_http issues one whole-file GET because libjxl wants the whole stream, which is not a range read. Decode threads already: measured 4.8x."

[[codec]]
name = "lerc"
multi_frame = false
chunked = false
streaming_decode = false
parallel_decode = false
range_reads = false
pyramid = false
http = false
feasible = "no"
note = "LERC's blocks are entropy-coded back to back with no offset table, and Lerc_c_api decodes a whole blob. Multiple bands are already handled inside one decode call."

[[codec]]
name = "lif"
multi_frame = true
chunked = false
streaming_decode = true
parallel_decode = false
range_reads = true
pyramid = false
http = true
feasible = "gap"
gaps = ["chunked"]
note = "LIF's XML header gives each plane's absolute offset and length, so a plane is a seek. The format stores no resolution levels, so there is no pyramid to expose."

[[codec]]
name = "lz4"
multi_frame = false
chunked = false
streaming_decode = false
parallel_decode = false
range_reads = false
pyramid = false
http = false
feasible = "gap"
gaps = ["streaming_decode"]
note = "LZ4F has a streaming decompressor. Per-block random access would need LZ4F_blockIndependent plus an index the frame format has nowhere to store, so it is unavailable without inventing a sidecar."

[[codec]]
name = "lzma"
multi_frame = false
chunked = false
streaming_decode = false
parallel_decode = false
range_reads = false
pyramid = false
http = false
feasible = "gap"
gaps = ["streaming_decode", "chunked"]
note = ".xz carries a block index in its footer and liblzma exposes it through lzma_index, so seeking to a block is genuinely in the format. Raw LZMA1 streams have no index and stay whole-file."

[[codec]]
name = "mozjpeg"
multi_frame = false
chunked = false
streaming_decode = false
parallel_decode = false
range_reads = false
pyramid = true
http = false
feasible = "gap"
gaps = ["streaming_decode"]
note = "same DCT scaling as jpeg, reached through TurboJPEG v2, which infers the factor from the destination size instead of taking it directly; the outputs are byte-identical to the jpeg codec at every supported ratio, and a test pins that. Scanline streaming is still unbuilt."

[[codec]]
name = "mrc"
multi_frame = true
chunked = true
streaming_decode = true
parallel_decode = false
range_reads = true
pyramid = false
http = true
feasible = "done"
note = "MRC is a 1024-byte header followed by a contiguous volume, so plane N is a fixed offset and a fixed length -- and plane(i) has read it that way all along. The chunked flag simply disagreed with the reader beside it, which has advertised is_chunked since it was written. Measured: one plane is 69x cheaper than read() on a 34 MB volume, and over HTTP it moves 1.8% of the file in 2 requests. Decode is a memcpy, so threading it would buy nothing."

[[codec]]
name = "nd2"
multi_frame = true
chunked = true
streaming_decode = true
parallel_decode = false
range_reads = true
pyramid = false
http = true
feasible = "gap"
gaps = ["parallel_decode"]
note = "chunks are independent, so decoding them across threads needs no format work. ND2 stores no resolution levels."

[[codec]]
name = "nifti"
multi_frame = true
chunked = false
streaming_decode = false
parallel_decode = false
range_reads = false
pyramid = false
http = false
feasible = "gap"
gaps = ["streaming_decode", "chunked", "range_reads", "http"]
note = "an uncompressed .nii is a 348-byte header and a contiguous volume, so a slice is an offset -- which is exactly how browser neuroimaging viewers fetch data. A .nii.gz is one deflate stream and gets none of it."

[[codec]]
name = "none"
multi_frame = false
chunked = false
streaming_decode = false
parallel_decode = false
range_reads = false
pyramid = false
http = false
feasible = "no"
note = "the identity codec, which exists so a container can say 'stored'. The container's own offsets already give random access; there is nothing here to make faster."

[[codec]]
name = "nrrd"
multi_frame = false
chunked = false
streaming_decode = false
parallel_decode = false
range_reads = true
pyramid = false
http = true
feasible = "gap"
gaps = ["streaming_decode", "chunked"]
note = "raw and detached NRRD put the data contiguously at a known offset, so slices are seeks, and the reader already reads at offsets over HTTP through core.open_read_at. The gzip and bzip2 encodings are single streams and stay whole-file."

[[codec]]
name = "numpy"
multi_frame = false
chunked = false
streaming_decode = false
parallel_decode = false
range_reads = false
pyramid = false
http = false
feasible = "gap"
gaps = ["streaming_decode", "chunked", "range_reads", "http"]
note = ".npy is a short header followed by a contiguous C-order buffer, so a slice is an offset and a length -- what np.load(mmap_mode=) exploits locally, and nothing stops the same arithmetic driving range requests."

[[codec]]
name = "oib"
multi_frame = true
chunked = false
streaming_decode = true
parallel_decode = false
range_reads = false
pyramid = false
http = true
feasible = "gap"
gaps = ["chunked", "range_reads"]
note = "OIB is an OLE compound file whose directory gives every stream's sector chain, so a plane is addressable without reading the whole archive; _ole2 already walks those chains."

[[codec]]
name = "oir"
multi_frame = true
chunked = true
streaming_decode = false
parallel_decode = false
range_reads = true
pyramid = false
http = true
feasible = "gap"
gaps = ["streaming_decode"]
note = "HTTP arrived by unification rather than by being built for OIR: the reader coerces its source through core.io.coerce_data_source, which turns an http(s) URL into an HTTPDataSource, and OIR already read at offsets. Verified against a range-serving test server -- opening and fully reading a 25.96 MB file moved 16.86 MB in 198 range requests, byte-identical to the local read. Streaming decode is what is left."

[[codec]]
name = "packints"
multi_frame = false
chunked = false
streaming_decode = false
parallel_decode = false
range_reads = false
pyramid = false
http = false
feasible = "no"
note = "unpacks sub-byte samples out of a buffer whose length the container fixed. The decode is one vectorized pass; there is no file here to stream."

[[codec]]
name = "pcodec"
multi_frame = false
chunked = false
streaming_decode = false
parallel_decode = false
range_reads = false
pyramid = false
http = false
feasible = "no"
note = "pcodec's wrapped format does have chunks, but the C surface it ships and we bind is pco_standalone_simple_compress_into / _decompress_into, which is whole-buffer. Per-chunk decode would mean binding a Rust API that has no C entry point today."

[[codec]]
name = "png"
multi_frame = false
chunked = false
streaming_decode = false
parallel_decode = false
range_reads = false
pyramid = false
http = false
feasible = "gap"
gaps = ["streaming_decode"]
note = "libspng has SPNG_DECODE_PROGRESSIVE with spng_decode_row and a spng_set_png_stream read callback, so rows can come out as bytes arrive. PNG has no tiles, so there is nothing to seek to, and Adam7 interlace gives seven passes rather than a resolution pyramid."

[[codec]]
name = "qoi"
multi_frame = false
chunked = false
streaming_decode = false
parallel_decode = false
range_reads = false
pyramid = false
http = false
feasible = "no"
note = "decoding position N needs every byte before it: QOI carries a running 64-entry hash table across the whole stream. Row-wise output could be bolted onto the vendored decoder, but the format targets images small enough that the whole buffer is already in memory."

[[codec]]
name = "quantize"
multi_frame = false
chunked = false
streaming_decode = false
parallel_decode = false
range_reads = false
pyramid = false
http = false
feasible = "no"
note = "a lossy rounding filter applied before a real compressor. It has no bitstream of its own."

[[codec]]
name = "rcomp"
multi_frame = false
chunked = false
streaming_decode = false
parallel_decode = false
range_reads = false
pyramid = false
http = false
feasible = "no"
note = "Rice compression of a single FITS tile. The tiling and the per-tile offsets live in the FITS file, and the fits reader is where that work belongs."

[[codec]]
name = "rgbe"
multi_frame = false
chunked = false
streaming_decode = false
parallel_decode = false
range_reads = false
pyramid = false
http = false
feasible = "gap"
gaps = ["streaming_decode"]
note = "Radiance .hdr is RLE per scanline, so rows can be produced as they arrive. There is no scanline offset table, so they cannot be seeked to."

[[codec]]
name = "snappy"
multi_frame = false
chunked = false
streaming_decode = false
parallel_decode = false
range_reads = false
pyramid = false
http = false
feasible = "gap"
gaps = ["streaming_decode"]
note = "the framing format is a sequence of self-contained chunks and decodes incrementally; the raw format we read and write is one-shot and has no index to seek with."

[[codec]]
name = "sperr"
multi_frame = false
chunked = false
streaming_decode = false
parallel_decode = false
range_reads = false
pyramid = false
http = false
feasible = "gap"
gaps = ["streaming_decode"]
note = "SPERR's bitstream is embedded, and SPERR3D_Stream_Tools exposes progressive_read and progressive_truncate: a prefix of the file decodes to a lower-quality version of the whole volume. That is quality progression rather than a tile index, so it buys early preview, not random access."

[[codec]]
name = "sz3"
multi_frame = false
chunked = false
streaming_decode = false
parallel_decode = false
range_reads = false
pyramid = false
http = false
feasible = "no"
note = "SZ3 entropy-codes the whole array as one unit: there are no independently decodable blocks in the bitstream, and upstream exposes no incremental entry point."

[[codec]]
name = "tiff"
multi_frame = true
chunked = true
streaming_decode = true
parallel_decode = true
range_reads = true
pyramid = true
http = true
feasible = "done"
note = "every capability the format offers is built. Tile and strip decode spreads across threads, and the worker count is sized by how much output there is rather than by a constant -- a fixed cap is wrong at both ends, losing to 8 threads on a 9 MB image and to 16 on a 75 MB one. Measured against single-threaded, 512px tiles: 6144x6144 uint16 lzw 12.2x, deflate 11.6x, zstd 3.2x. Uncompressed segments stay serial whatever is asked for, because their decode is a memcpy and threading it measured slower. Local files are mapped rather than read segment by segment, and the byte-order check no longer swaps a little-endian file on a little-endian machine, which had been costing a full copy per tile."

[[codec]]
name = "vsi"
multi_frame = true
chunked = true
streaming_decode = true
parallel_decode = false
range_reads = false
pyramid = false
http = false
feasible = "gap"
gaps = ["pyramid", "range_reads", "http"]
note = "the pyramid is feasible for whole-slide VSI in principle, but it is blocked on a sample to check against rather than on effort, and that distinction is the point of this entry. The one VSI in the corpus has no pyramid at all: its ETS trailer is a table of four entries naming blocks of identically sized 260x216 planes, 144 in total at one resolution, and the top-level .vsi page is that same size. The parser used to report level_count=6 from that trailer, which was a misreading of a constant repeated in every record -- a test asserted the 6, so it pinned the parser's own output rather than anything about the file. Both are fixed. Writing a pyramid reader from this file alone would be guessing. Range reads and HTTP are unblocked: the plane offsets are already parsed."

[[codec]]
name = "webp"
multi_frame = false
chunked = false
streaming_decode = false
parallel_decode = false
range_reads = false
pyramid = false
http = false
feasible = "gap"
gaps = ["streaming_decode", "multi_frame"]
note = "WebPIAppend decodes incrementally as bytes arrive, and WebPAnimDecoder reads animated WebP, which we do not read at all today. libwebp's threading is an encoder setting (WebPConfig.thread_level), so decode stays on one core: measured 1.00x."

[[codec]]
name = "xor"
multi_frame = false
chunked = false
streaming_decode = false
parallel_decode = false
range_reads = false
pyramid = false
http = false
feasible = "no"
note = "out[i] depends on out[i-dist], the same serial chain as delta. There is no boundary inside one buffer to seek to, and the container picks the block."

[[codec]]
name = "zfp"
multi_frame = false
chunked = false
streaming_decode = false
parallel_decode = false
range_reads = false
pyramid = false
http = false
feasible = "gap"
gaps = ["chunked", "parallel_decode"]
note = "in fixed-rate mode every 4^d block occupies the same number of bits, so a block's position is arithmetic and zfp_decode_block_* is the per-block entry point: true random access, which is what fixed-rate mode exists for. The variable-rate modes cannot do this, so it would be a fixed-rate-only path."

[[codec]]
name = "zstd"
multi_frame = false
chunked = false
streaming_decode = false
parallel_decode = false
range_reads = false
pyramid = false
http = false
feasible = "gap"
gaps = ["streaming_decode"]
note = "ZSTD_decompressStream decodes without holding the whole frame. Random access into one frame is not possible: there is no index, and the seekable format is a separate container rather than a mode."
